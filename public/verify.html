<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>入校核验 · 示例学校</title><link rel="stylesheet" href="/style.css?v=20261020-logo1"><link rel="stylesheet" href="/verify.css?v=20261025-motion1"><script src="/verify.js?v=20261028-direct-card1" defer></script></head><body><main class="gate-main"><header><div class="brand"><img class="school-logo" src="/logo.svg" alt="示例学校校徽" width="48" height="48"><span>示例学校<span class="english">CAMPUS VISITOR SERVICE</span></span><span class="badge">大门核验</span></div></header><section id="lookup"><h2>核验来访信息</h2><form id="gateForm"><label>访客手机号<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="申请时登记的11位手机号"></label><label>来访验证码<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="([0-9]{4}|[0-9]{8})" maxlength="8" required placeholder="邮件中的4位验证码（兼容旧8位码）"></label><p id="gateError" role="alert"></p><button class="gate-button" id="verifySubmit" disabled>核验并打开临时入校卡</button></form><p class="intro">多人来访可使用同一申请验证码，每位访客需输入各自登记的手机号。验证码有效期至预约结束。</p></section><section id="pass" hidden aria-live="polite"><div id="passBanner" class="pass-banner"><div id="passAnimation" hidden aria-label="实时放行动态标识"><svg class="pass-motion" viewBox="0 0 160 160" role="img" aria-label="获准放行"><circle class="pass-track" cx="80" cy="80" r="64"/><g class="pass-orbit"><circle class="pass-ring" cx="80" cy="80" r="64"/><circle class="pass-dot" cx="80" cy="16" r="5"/></g><circle class="pass-core" cx="80" cy="80" r="49"/><path class="pass-check" d="M55 80 L73 98 L107 62"/><path class="pass-flow flow-one" d="M62 125 L80 134 L98 125"/><path class="pass-flow flow-two" d="M62 137 L80 146 L98 137"/></svg><strong class="pass-permission">获准放行</strong><span class="pass-motion-caption">动态核验中 · 请出示实时页面</span></div><span id="statusIcon">!</span><h2 id="passStatus"></h2><p>示例学校 · 临时入校卡</p></div><div class="pass-body"><p class="pass-label">访客姓名</p><h2 id="visitorName"></h2><dl><dt>预约日期</dt><dd id="visitDate"></dd><dt>有效时间</dt><dd id="visitTime"></dd><dt>审批编号</dt><dd id="approvalNo"></dd></dl><div class="live-time"><span class="pulse"></span>实时核验 <strong id="checkedAt"></strong></div><p id="passHint" class="intro"></p><p class="intro">请向门岗出示实时页面及本人有效证件，按预约时间入离校。此卡供门岗人工核验，不直接控制门禁设备。</p><button type="button" class="gate-button" id="refreshPass">现场刷新核验</button><button type="button" class="add" id="resetPass">核验其他访客</button></div></section><p class="bottom">相约校园，从这里开始</p></main></body></html>

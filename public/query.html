<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>审批结果查询 · 校园访客服务</title><link rel="stylesheet" href="/style.css?v=20261020-logo1"><link rel="stylesheet" href="/verify.css"><script src="/query.js?v=20261028-direct-card1" defer></script></head><body><main class="gate-main"><header><div class="brand"><img class="school-logo" src="/logo.svg" alt="示例学校校徽" width="48" height="48"><span>校园访客服务<span class="english">CAMPUS VISITOR SERVICE</span></span><span class="badge">结果查询</span></div><p class="eyebrow">VISIT APPLICATION STATUS</p><h1>来访进度，<br>随时掌握。</h1><p class="intro">输入校内被访者姓名、访客姓名、访客手机号和来访日期，查看审批结果；全部通过后可查看核验码。</p></header><section><h2>查询来访申请</h2><form id="queryForm"><label>校内被访者姓名<input id="queryHostName" type="text" autocomplete="off" maxlength="50" required placeholder="校内被访者在企业微信登记的姓名"></label><label>访客姓名<input id="queryVisitorName" type="text" autocomplete="off" maxlength="50" required placeholder="本次申请登记的访客姓名"></label><label>访客手机号<input id="queryPhone" type="tel" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required placeholder="本次申请登记的访客手机号"></label><label>来访日期<input id="queryDate" type="date" required></label><p class="intro">请选择申请时填写的入校日期。</p><p id="queryError" role="alert"></p><button id="queryButton" class="gate-button" disabled>查询审批结果</button></form><p class="intro">本机会保存本次查询的被访者姓名、访客姓名、访客手机号和来访日期7天，再次打开自动查询最新结果。公用设备使用后请清除记录。</p><button id="forgetQuery" type="button" hidden>清除本机查询信息</button></section><section id="queryResult" hidden aria-live="polite"><div id="resultPicker" hidden><label>选择来访申请<select id="resultSelect"></select></label></div><p id="querySummary" class="intro"></p><h2 id="queryStatus"></h2><dl><dt>审批编号</dt><dd id="resultNo"></dd><dt>预约日期</dt><dd id="resultDate"></dd><dt>预约时段</dt><dd id="resultTime"></dd></dl><div id="resultCodeWrap" class="tips" hidden><b>本次入校核验码</b><p id="resultCode" class="result-code"></p><button id="openPass" type="button" class="gate-button">打开临时入校卡</button><p id="openPassError" role="alert"></p></div><p id="resultNote" class="intro"></p><p class="intro">如有填写通知邮箱，全部审批通过后会收到邮件，请同时留意垃圾邮件。</p></section><p class="bottom"><a href="/">返回入校申请表</a></p></main></body></html>
